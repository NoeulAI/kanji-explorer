<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jōyō Kanji Explorer — 2136 by Radical</title>
<style>
  :root{
    --paper:#f6f1e6;
    --paper-deep:#ece3d1;
    --ink:#2b2620;
    --ink-soft:#6b6256;
    --seal:#a13d2e;
    --seal-soft:#c97a64;
    --gold:#9c7a32;
    --line:#d8cdb4;
    --card:#fffdf8;
    --accent-bg:#eee3c8;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: "Hiragino Mincho ProN","Yu Mincho","Noto Serif JP", Georgia, serif;
    background-image:
      radial-gradient(circle at 10% 0%, rgba(161,61,46,0.04), transparent 45%),
      radial-gradient(circle at 95% 100%, rgba(156,122,50,0.05), transparent 40%);
  }

  header{
    padding: 28px clamp(16px,4vw,48px) 18px;
    border-bottom: 1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
    gap:24px; flex-wrap:wrap;
  }
  .title-block{display:flex; align-items:baseline; gap:16px;}
  .title-seal{
    font-size:34px; line-height:1; color:var(--seal);
    font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
    border:2px solid var(--seal); border-radius:6px;
    padding:4px 8px; transform:rotate(-2deg);
  }
  h1{ font-size:22px; margin:0; font-weight:600; letter-spacing:0.02em; }
  h1 small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:0.12em; color:var(--ink-soft); margin-top:4px; text-transform:uppercase;}
  .stats{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); display:flex; gap:18px; flex-wrap:wrap; }
  .stats b{color:var(--seal); font-size:14px;}

  .controls{
    padding: 16px clamp(16px,4vw,48px);
    border-bottom:1px solid var(--line);
    display:flex; gap:14px; flex-wrap:wrap; align-items:center;
    background:var(--paper-deep);
    position:sticky; top:0; z-index:50;
  }
  .ctrl-group{display:flex; flex-direction:column; gap:4px;}
  .ctrl-group label{ font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); }
  select, input[type="text"]{
    font-family: inherit; font-size:14px;
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    padding:7px 10px; color:var(--ink); min-width:140px;
  }
  input[type="text"]{min-width:260px;}
  select:focus, input:focus{outline:2px solid var(--seal-soft); outline-offset:1px;}
  .pill-toggle{display:flex; gap:6px;}
  .pill-toggle button{
    font-family:var(--mono); font-size:11px; letter-spacing:0.04em;
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    padding:7px 12px; border-radius:20px; cursor:pointer; transition:all .15s;
  }
  .pill-toggle button.active{background:var(--seal); color:#fff; border-color:var(--seal);}
  .pill-toggle button:hover:not(.active){border-color:var(--seal-soft); color:var(--ink);}

  .layout{display:flex;}
  nav.rail{
    width:230px; flex-shrink:0; border-right:1px solid var(--line);
    height: calc(100vh - 138px); overflow-y:auto; padding: 10px 0 60px;
    position:sticky; top:138px;
  }
  nav.rail::-webkit-scrollbar{width:6px;}
  nav.rail::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
  .rail-item{ display:flex; align-items:baseline; gap:8px; padding:6px 16px; cursor:pointer; font-size:13px; border-left:3px solid transparent; }
  .rail-item:hover{background:var(--accent-bg);}
  .rail-item.active{background:var(--accent-bg); border-left-color:var(--seal); font-weight:600;}
  .rail-item .rc{font-size:18px; width:26px; flex-shrink:0; text-align:center;}
  .rail-item .rn{font-family:var(--mono); font-size:10px; color:var(--ink-soft); width:24px;}
  .rail-item .rname{flex:1; color:var(--ink-soft); font-size:11.5px;}
  .rail-item .rcount{font-family:var(--mono); font-size:10px; color:var(--gold);}

  main{flex:1; min-width:0; padding: 20px clamp(16px,3vw,40px) 80px;}

  .radical-group{margin-bottom:34px;}
  .radical-group-header{
    display:flex; align-items:baseline; gap:14px;
    border-bottom:2px solid var(--ink); padding-bottom:8px; margin-bottom:14px;
    scroll-margin-top:150px;
  }
  .radical-group-header .big-char{ font-size:38px; line-height:1; color:var(--seal); }
  .radical-group-header .meta{display:flex; flex-direction:column;}
  .radical-group-header .meta .name{font-size:16px; font-weight:600;}
  .radical-group-header .meta .sub{font-family:var(--mono); font-size:11px; color:var(--ink-soft); letter-spacing:0.04em;}
  .radical-group-header .gcount{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--gold);}

  .kanji-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(108px,1fr)); gap:10px; }
  .kcard{
    background:var(--card); border:1px solid var(--line); border-radius:6px;
    padding:10px 8px 8px; text-align:center; cursor:pointer;
    transition: transform .12s, box-shadow .12s, border-color .12s;
    position:relative;
  }
  .kcard:hover{ transform: translateY(-2px); box-shadow: 0 4px 14px rgba(43,38,32,0.12); border-color: var(--seal-soft); }
  .kcard .kc{font-size:30px; line-height:1.1; font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;}
  .kcard .km{
    font-size:10.5px; color:var(--ink-soft); margin-top:5px; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; min-height:26px;
  }
  .kcard .kbadges{display:flex; justify-content:center; gap:5px; margin-top:5px;}
  .kcard .badge{ font-family:var(--mono); font-size:8.5px; padding:1px 5px; border-radius:8px; background:var(--accent-bg); color:var(--ink-soft); }
  .badge-hanja{ background:#d0eae8 !important; color:#1a6b65 !important; font-weight:600; }
  .badge-hanja-only{ background:#e8d8f5 !important; color:#5b3a8c !important; font-weight:600; }
  .kcard.kanji-card{ border-left:3px solid #7a1f1f; }          /* pure kanji: dark red */
  .kcard.hanja-card{ border-left:3px solid #1a6b65; }          /* dual kanji+hanja: teal */
  .kcard.hanja-card .kc{ color:#1a6b65; }
  .kcard.hanja-only-card{ border-left:3px solid #5b3a8c; }     /* hanja-only: purple */
  .kcard.hanja-only-card .kc{ color:#5b3a8c; }
  .kcard .thumb{
    width:100%; height:34px; object-fit:cover; border-radius:4px; margin-top:5px; display:block;
  }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:var(--mono); font-size:13px; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,38,32,0.55);
    display:none; align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--card); border-radius:10px; max-width:560px; width:100%;
    padding:30px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.3);
    border:1px solid var(--line); max-height:88vh; overflow-y:auto;
  }
  .modal-close{ position:absolute; top:14px; right:16px; cursor:pointer; font-size:20px; color:var(--ink-soft); border:none; background:none; line-height:1; }
  .modal-close:hover{color:var(--seal);}

  .stroke-stage{ display:flex; gap:22px; align-items:center; justify-content:center; margin: 4px 0 6px; }
  .stroke-svg-wrap{
    width:180px; height:180px; background:#fff; border:1px solid var(--line); border-radius:8px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 90px 90px; background-position:center;
  }
  .stroke-svg-wrap svg{width:160px; height:160px;}
  .stroke-controls{display:flex; flex-direction:column; gap:8px; align-items:flex-start;}
  .stroke-controls button{
    font-family:var(--mono); font-size:11px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); padding:7px 14px; border-radius:20px; cursor:pointer; min-width:120px;
  }
  .stroke-controls button:hover{border-color:var(--seal); color:var(--seal);}
  .stroke-meta{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
  .stroke-speed{display:flex; align-items:center; gap:6px;}
  .stroke-speed input{width:90px;}

  .modal .mrad{text-align:center; font-family:var(--mono); font-size:12px; color:var(--seal); margin-top:2px; margin-bottom:10px;}
  .modal-section{margin-top:16px;}
  .modal-section .label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:4px;}
  .modal-section .val{font-size:14px; line-height:1.5;}
  .modal-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}

  .screenshot-zone{
    margin-top:16px; border:1px dashed var(--line); border-radius:8px; padding:12px;
    text-align:center; background:rgba(238,227,200,0.3);
  }
  .screenshot-zone img{ max-width:100%; max-height:220px; border-radius:6px; display:block; margin:0 auto 8px; }
  .screenshot-zone input[type="file"]{ font-family:var(--mono); font-size:11px; }
  .screenshot-zone .ss-actions{ display:flex; gap:8px; justify-content:center; margin-top:8px; }
  .screenshot-zone button{
    font-family:var(--mono); font-size:11px; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); padding:6px 12px; border-radius:14px; cursor:pointer;
  }
  .screenshot-zone button:hover{border-color:var(--seal); color:var(--seal);}

  /* ---------- My Radicals editor ---------- */
  .myrad-toolbar{
    display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap;
  }
  .myrad-toolbar input[type="text"]{ min-width:180px; }
  .myrad-toolbar button{
    font-family:var(--mono); font-size:11px; border:1px solid var(--seal); background:var(--seal);
    color:#fff; padding:7px 16px; border-radius:18px; cursor:pointer;
  }
  .myrad-toolbar button:hover{opacity:0.88;}
  .myrad-toolbar button.secondary-btn{
    background:var(--card); color:var(--ink-soft); border-color:var(--line);
  }
  .myrad-toolbar button.secondary-btn:hover{ border-color:var(--seal); color:var(--seal); opacity:1; }
  .myrad-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .myrad-chip{
    display:flex; align-items:center; gap:7px; padding:6px 8px 6px 12px; border-radius:20px;
    border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:14px;
  }
  .myrad-chip.active{ background:var(--seal); color:#fff; border-color:var(--seal); }
  .myrad-chip .count{ font-family:var(--mono); font-size:10px; opacity:0.7; }
  .myrad-chip .rm{
    font-size:13px; line-height:1; opacity:0.5; padding:2px 4px; border-radius:50%;
  }
  .myrad-chip .rm:hover{ opacity:1; background:rgba(0,0,0,0.15); }
  .myrad-target-banner{
    font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-bottom:14px;
    padding:10px 14px; background:var(--accent-bg); border-radius:6px; border:1px solid var(--line);
  }
  .myrad-target-banner b{ color:var(--seal); font-size:14px; font-family: inherit; }
  .kcard.assign-mode:hover{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(156,122,50,0.3); }

  .myrad-split{ display:flex; gap:24px; align-items:flex-start; }
  .myrad-pane{ flex:1; min-width:0; }
  .myrad-pane-header{
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-soft); margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .myrad-pane-header .n{ color:var(--gold); }
  .myrad-assigned-bucket{ margin-bottom:22px; }
  .myrad-assigned-bucket-title{
    font-size:15px; font-weight:600; border-bottom:1px solid var(--line);
    padding-bottom:6px; margin-bottom:10px; display:flex; align-items:baseline; gap:8px;
  }
  .myrad-assigned-bucket-title .c{ font-family:var(--mono); font-size:11px; color:var(--gold); margin-left:auto; }
  .kcard.assigned-card{ cursor:pointer; position:relative; }
  .kcard.assigned-card:hover{ border-color:var(--seal-soft); box-shadow:0 4px 14px rgba(43,38,32,0.12); }
  .kcard-remove{
    position:absolute; top:4px; right:4px;
    font-size:11px; line-height:1; padding:2px 5px; border-radius:50%;
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    cursor:pointer; opacity:0; transition:opacity .12s;
    font-family:var(--mono);
  }
  .kcard.assigned-card:hover .kcard-remove{ opacity:1; }
  .kcard-remove:hover{ background:var(--seal); color:#fff; border-color:var(--seal); }
  .kcard.theme-assign-mode:hover{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(156,122,50,0.35); }
  .kcard.theme-assigned{ border-bottom:3px solid var(--seal); }

  .myrad-theme-editor{
    margin: 8px 0 14px 0; padding:10px 12px;
    background:rgba(238,227,200,0.35); border-radius:6px; border:1px solid var(--line);
  }
  .myrad-theme-editor-title{
    font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-soft); margin-bottom:8px;
  }
  .myrad-theme-add-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .myrad-theme-add-row input{
    font-family:inherit; font-size:13px; padding:5px 9px;
    border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink);
    flex:1; min-width:0;
  }
  .myrad-theme-add-row button{
    font-family:var(--mono); font-size:11px;
    border:1px solid var(--seal); background:var(--seal); color:#fff;
    padding:5px 12px; border-radius:16px; cursor:pointer; white-space:nowrap;
  }
  .myrad-theme-add-row button:hover{opacity:0.88;}
  .myrad-theme-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .myrad-theme-chip{
    display:flex; align-items:center; gap:6px;
    padding:4px 8px 4px 11px; border-radius:16px;
    border:1px solid var(--line); background:var(--card); cursor:pointer; font-size:13px;
    transition: all .12s;
  }
  .myrad-theme-chip.active{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .myrad-theme-chip .tcount{ font-family:var(--mono); font-size:9.5px; opacity:0.7; }
  .myrad-theme-chip .trm{
    font-size:12px; opacity:0.5; padding:1px 3px; border-radius:50%; font-family:var(--mono);
  }
  .myrad-theme-chip .trm:hover{ opacity:1; background:rgba(0,0,0,0.15); }
  .myrad-theme-banner{
    font-family:var(--mono); font-size:11px; color:var(--ink-soft);
    margin:4px 0 8px; padding:6px 10px; border-radius:5px;
    background:rgba(156,122,50,0.12); border:1px solid rgba(156,122,50,0.25);
  }
  .myrad-theme-banner b{ color:var(--gold); }
  @media (max-width: 980px){
    .myrad-split{ flex-direction:column; }
  }
  .kcard.assigned-here{ opacity:0.4; }

  @media (max-width: 760px){
    nav.rail{display:none;}
    .controls{position:static;}
    .stroke-stage{flex-direction:column;}
  }
  .practice-zone{ margin-top:14px; text-align:center; }
  .practice-zone .label{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:6px; }
  #practice-canvas{ width:220px; height:220px; background:#fff; border:1px solid var(--line); border-radius:8px; touch-action:none; cursor:crosshair; display:block; margin:0 auto; }
  .practice-actions{ display:flex; gap:8px; justify-content:center; margin-top:8px; }
  .practice-actions button{ font-family:var(--mono); font-size:11px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 12px; border-radius:14px; cursor:pointer; }
  .practice-actions button:hover{ border-color:var(--seal); color:var(--seal); }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <div class="title-seal">漢</div>
    <h1>Kanji Explorer</h1>
  </div>
  <div class="stats">
    <span><b id="stat-visible">2136</b> shown</span>
    <span><b id="stat-radicals">195</b> radicals</span>
  </div>
</header>

<div class="controls">
  <div class="ctrl-group">
    <label>Search</label>
    <input type="text" id="search" placeholder="kanji, meaning, reading…">
  </div>
  <div class="ctrl-group">
    <label>View</label>
    <div class="pill-toggle">
      <button data-view="main" class="active">Main list</button>
      <button data-view="myradicals">Radicalwise</button>
      <button data-view="kana">Kana &amp; Hangul</button>
    </div>
  </div>
  <div class="ctrl-group" id="main-filter-group">
    <label>Show</label>
    <div class="pill-toggle">
      <button data-filter="all" class="active">All (2214)</button>
      <button data-filter="kanji">Kanji only (2136)</button>
      <button data-filter="hanja">Hanja only (535)</button>
    </div>
  </div>
</div>

<div class="layout">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>

    <div class="stroke-stage">
      <div class="stroke-svg-wrap">
        <svg id="stroke-svg" viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="stroke-controls">
        <button id="stroke-replay">↻ Replay</button>
        <button id="stroke-step">⏭ Step one stroke</button>
        <div class="stroke-speed">
          <label class="stroke-meta">Speed</label>
          <input type="range" id="stroke-speed" min="300" max="2000" value="650" step="50">
        </div>
        <div class="stroke-meta" id="stroke-count-label"></div>
      </div>
    </div>
    <div class="mrad" id="m-rad"></div>

    <div class="practice-zone">
      <div class="label">Practice — write it yourself</div>
      <canvas id="practice-canvas" width="440" height="440"></canvas>
      <div class="practice-actions">
        <button id="practice-undo">↶ Undo</button>
        <button id="practice-clear">✕ Clear</button>
        <button id="practice-ghost">Guide: on</button>
      </div>
    </div>

    <div class="modal-section"><div class="label">Strokes</div><div class="val" id="m-stroke"></div></div>
    <div class="modal-section"><div class="label">Meanings</div><div class="val" id="m-mean"></div></div>
    <div class="modal-section"><div class="label">On-yomi</div><div class="val" id="m-on"></div></div>
    <div class="modal-section"><div class="label">Kun-yomi</div><div class="val" id="m-kun"></div></div>
    <div class="modal-section" id="m-korean-section" style="display:none;">
      <div class="label" style="color:#1a6b65;">Korean (한자)</div>
      <div class="val" id="m-korean"></div>
    </div>

    <div class="screenshot-zone" id="screenshot-zone">
      <div class="label" style="margin-bottom:8px;">Your screenshot (saved in this browser only)</div>
      <div id="screenshot-preview"></div>
      <input type="file" id="screenshot-input" accept="image/*">
      <div class="ss-actions" id="screenshot-actions" style="display:none;">
        <button id="screenshot-remove">Remove image</button>
      </div>
    </div>
  </div>
</div>

<!-- Stroke order data is CC BY-SA 3.0 (c) Ulrich Apel, KanjiVG project: https://kanjivg.tagaini.net -->
<script src="kanji_data.js"></script>
<script src="kana_data.js"></script>
<script>
/* ============================================================================
   PERMANENT EDITS
   ----------------------------------------------------------------------------
   Your "My Radicals" assignments are saved in this browser's storage, not in
   this file. If you want them baked permanently into kanji_data.js instead
   (so they show up on any computer), open kanji_data.js in a text editor,
   search for the kanji character, and add a "my_radical" field with your
   bucket name as the value, e.g.:
       {"kanji":"水", ... ,"my_radical":"Water family"}
   ============================================================================ */

/* ---------------- IndexedDB for screenshots ---------------- */
const DB_NAME = 'kanjiExplorerDB';
const DB_STORE = 'screenshots';
let dbPromise = null;
function getDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ()=>{
      req.result.createObjectStore(DB_STORE);
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
async function saveScreenshot(kanji, dataUrl){
  const db = await getDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(dataUrl, kanji);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function loadScreenshot(kanji){
  const db = await getDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(kanji);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function deleteScreenshot(kanji){
  const db = await getDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(kanji);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
// cache of which kanji have a screenshot, for showing thumbnails in the grid without
// awaiting IndexedDB per-card; populated lazily and refreshed after upload/remove.
let screenshotKeysCache = null;
async function getScreenshotKeys(){
  if(screenshotKeysCache) return screenshotKeysCache;
  const db = await getDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAllKeys();
    req.onsuccess = ()=>{ screenshotKeysCache = new Set(req.result); resolve(screenshotKeysCache); };
    req.onerror = ()=> reject(req.error);
  });
}
function invalidateScreenshotCache(){ screenshotKeysCache = null; }

async function getAllScreenshotsForExport(){
  const db = await getDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readonly');
    const store = tx.objectStore(DB_STORE);
    const keysReq = store.getAllKeys();
    const valsReq = store.getAll();
    let keys, vals;
    keysReq.onsuccess = ()=>{ keys = keysReq.result; finish(); };
    valsReq.onsuccess = ()=>{ vals = valsReq.result; finish(); };
    tx.onerror = ()=> reject(tx.error);
    function finish(){
      if(keys && vals){
        const out = {};
        keys.forEach((k,i)=>{ out[k] = vals[i]; });
        resolve(out);
      }
    }
  });
}
async function restoreAllScreenshots(map){
  const db = await getDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    const store = tx.objectStore(DB_STORE);
    Object.entries(map || {}).forEach(([kanji, dataUrl])=> store.put(dataUrl, kanji));
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}

/* ---------------- My Radicals: list + assignments (localStorage) ---------------- */

function loadMyRadicalsList(){
  try {
    const raw = localStorage.getItem(MYRAD_LIST_KEY);
    const arr = raw === null ? [] : JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function addMyRadical(name){
  const list = loadMyRadicalsList();
  if(!list.includes(name)){
    list.push(name);
    try{ localStorage.setItem(MYRAD_LIST_KEY, JSON.stringify(list)); }
    catch(e){ console.warn('Could not save radical list', e); }
  }
  return list;
}
function removeMyRadical(name){
  const list = loadMyRadicalsList().filter(r => r !== name);
  try{ localStorage.setItem(MYRAD_LIST_KEY, JSON.stringify(list)); }

}
function loadMyRadicalsAssignments(){

function assignKanjiToBucket(kanji, bucketName){

/* ---------------- core data + state ---------------- */
const kanjiList = KANJI_DATA.kanji;
const radicalMeta = KANJI_DATA.radicals;

let state = { search: "", view: "main", filter: "all" };

function matchesSearch(k){
  if(!state.search) return true;
  const s = state.search.toLowerCase();
  const hay = (k.kanji + k.meanings + k.on + k.kun + k.radical_char + k.radical_name).toLowerCase();
  return hay.includes(s);
}

function matchesFilter(k){
  if(state.filter === 'kanji') return !k.is_hanja_only;
  if(state.filter === 'hanja') return !!(k.is_hanja_only || (typeof KANA_DATA !== 'undefined' && KANA_DATA.hanja && KANA_DATA.hanja[k.kanji]));
  return true; // 'all'
}

function render(){
  // Show/hide the main-list filter group based on view
  const fg = document.getElementById('main-filter-group');
  if(fg) fg.style.display = state.view === 'main' ? '' : 'none';

  if(state.view === 'myradicals'){
    renderMyRadicals();
    return;
  }
  if(state.view === 'kana'){
    renderKana();
    return;
  }
  renderMainList();
}

function renderMainList(){
  const filtered = kanjiList.filter(k => matchesSearch(k) && matchesFilter(k));
  document.getElementById('stat-visible').textContent = filtered.length;

  const groups = {};
  filtered.forEach(k=>{
    const gk = k.radical_num;
    if(!groups[gk]) groups[gk] = [];
    groups[gk].push(k);
  });
  const groupKeys = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  document.getElementById('stat-radicals').textContent = groupKeys.length;

  const main = document.getElementById('main');
  const rail = document.getElementById('rail');
  main.innerHTML = '';
  rail.innerHTML = '';

  if(groupKeys.length === 0){
    main.innerHTML = '<div class="empty-state">No kanji match this search.</div>';
    return;
  }

  const collator = new Intl.Collator('ja');

  groupKeys.forEach(gk=>{
    const rm = radicalMeta[String(gk)];
    const members = [...groups[gk]].sort((a,b)=> a.strokes_total - b.strokes_total || collator.compare(a.kanji,b.kanji));
    const groupId = 'grp-' + gk;

    const railItem = document.createElement('div');
    railItem.className = 'rail-item';
    railItem.onclick = ()=> document.getElementById(groupId).scrollIntoView({behavior:'smooth', block:'start'});
    railItem.innerHTML = `<span class="rc">${rm.char}</span><span class="rn">#${rm.num}</span><span class="rname">${rm.name}</span><span class="rcount">${members.length}</span>`;
    rail.appendChild(railItem);

    const section = document.createElement('section');
    section.className = 'radical-group';
    section.id = groupId;

    const header = document.createElement('div');
    header.className = 'radical-group-header';
    header.innerHTML = `
      <span class="big-char">${rm.char}</span>
      <div class="meta"><span class="name">${rm.name}</span><span class="sub">Radical #${rm.num} · ${rm.stroke} stroke${rm.stroke>1?'s':''}</span></div>
      <span class="gcount">${members.length} kanji</span>`;
    section.appendChild(header);

    section.appendChild(buildGrid(members, {assignMode:false}));
    main.appendChild(section);
  });

  attachThumbnails();
}

function openKanaModal(char, meta, strokeData){
  restoreStrokeSVG();
  // Reuse the existing modal but with kana-specific content
  document.getElementById('m-rad').textContent = `${meta.type === 'hiragana' ? 'Hiragana' : 'Katakana'} — ${meta.roman}`;
  document.getElementById('m-stroke').textContent = strokeData ? strokeData.stroke_count + ' strokes' : '—';
  document.getElementById('m-mean').textContent = meta.name;
  document.getElementById('m-on').textContent = '—';
  document.getElementById('m-kun').textContent = '—';
  document.getElementById('m-korean-section').style.display = 'none';
  document.getElementById('stroke-count-label').textContent = strokeData ? strokeData.stroke_count + ' strokes (AnimCJK)' : '';

  // Build stroke paths: each "stroke" may have multiple path segments (split due to self-intersection)
  // The animCJK paths use viewBox 0 0 1024 1024, our SVG needs to match
  const svg = document.getElementById('stroke-svg');
  svg.setAttribute('viewBox', '0 0 1024 1024');

  const STROKE_COLORS = ['#FF0000','#0000FF','#008000','#FFC400','#800080','#FFA500'];
  const pathEls = [];

  try{
    svg.innerHTML = '';
    if(strokeData){
      strokeData.strokes.forEach((segGroup, strokeIdx)=>{
        const color = STROKE_COLORS[strokeIdx % STROKE_COLORS.length];
        segGroup.forEach(d=>{
          const p = document.createElementNS('http://www.w3.org/2000/svg','path');
          p.setAttribute('d', d);
          p.setAttribute('fill', 'none');
          p.setAttribute('stroke', color);
          p.setAttribute('stroke-width', '50');  // thicker: animCJK uses 1024x1024 viewBox
          p.setAttribute('stroke-linecap', 'round');
          p.setAttribute('stroke-linejoin', 'round');
          p.setAttribute('pathLength', '3333');
          svg.appendChild(p);
          pathEls.push(p);
        });
      });
    }
    activePathEls = pathEls;
    stepIndex = -1;
    const speed = Number(document.getElementById('stroke-speed').value);
    if(pathEls.length) currentStrokeAnim = animateStrokes(pathEls, speed);
  } catch(err){
    console.warn('Kana stroke animation failed', err);
    activePathEls = [];
  }

  // Reset screenshot zone (kana don't have screenshots in this version)
  document.getElementById('screenshot-preview').innerHTML = '';
  document.getElementById('screenshot-actions').style.display = 'none';

  document.getElementById('modal-overlay').classList.add('open');
}

    .replace(/width="[^"]*"/, 'width="100%"')

    .replace(/style="[^"]*\.order-arrow[^"]*"/, ''); // remove any style that might interfere

function buildGrid(members, opts){
  opts = opts || {};
  const grid = document.createElement('div');
  grid.className = 'kanji-grid';
  members.forEach(k=> grid.appendChild(buildKcard(k, opts)));
  return grid;
}

function buildKcard(k, opts){
  opts = opts || {};
  const card = document.createElement('div');
  card.className = 'kcard';
  card.dataset.kanji = k.kanji;
  const firstMeaning = (k.meanings || '').split(';')[0].trim();

  // Three-way classification:
  //   isHanjaOnly  → hanja-only-card (purple): 78 traditional chars not in jouyou
  //   hanjaEntry   → hanja-card (teal): 457 chars in both jouyou kanji + hanja
  //   else         → kanji-card (dark red): 1679 pure jouyou kanji
  const isHanjaOnly = !!k.is_hanja_only;
  const hanjaEntry = !isHanjaOnly && (typeof KANA_DATA !== 'undefined' && KANA_DATA.hanja)
    ? KANA_DATA.hanja[k.kanji] : null;
  const isDual = !!hanjaEntry;

  if(isHanjaOnly){
    card.classList.add('hanja-only-card');
  } else if(isDual){
    card.classList.add('hanja-card');
  } else {
    card.classList.add('kanji-card');
  }

  // Korean reading for this character (first romanized reading)
  const koreanReading = isHanjaOnly
    ? (k.korean && k.korean[0])
    : (isDual && hanjaEntry.korean && hanjaEntry.korean[0]);

  // .km (small text under the character):
  //   kanji/dual  → first on-yomi reading (Japanese pronunciation), e.g. "スイ"
  //   hanja-only  → Korean reading, e.g. "rae"
  //   fallback    → first English meaning
  const onReading = (k.on || '').split(';')[0].trim();
  const kmText = isHanjaOnly
    ? (koreanReading || firstMeaning)
    : (onReading || firstMeaning);

  // badge: stroke count + Korean reading if available (teal for dual, purple for hanja-only)
  const koreaBadgeClass = isHanjaOnly ? 'badge-hanja-only' : 'badge-hanja';
  const koreaBadge = koreanReading
    ? `<span class="badge ${koreaBadgeClass}" title="Korean reading">${koreanReading}</span>`
    : '';

  card.innerHTML = `
    <div class="kc">${k.kanji}</div>
    <div class="km">${kmText}</div>
    <div class="kbadges">
      <span class="badge">${k.strokes_total}画</span>
      ${koreaBadge}
    </div>
    <div class="thumb-slot"></div>`;

  // For the modal, hanja-only chars need their own modal (no kanji data, uses hanja strokes)
  const openThisModal = isHanjaOnly && (typeof KANA_DATA !== 'undefined' && KANA_DATA.hanja)
    ? ()=> openHanjaModal(k.kanji, KANA_DATA.hanja[k.kanji])
    : ()=> openModal(k);

  if(opts.assignMode){
    // right pane: click to file into the active radical bucket
    card.classList.add('assign-mode');
    card.onclick = ()=>{
      if(!activeAssignTarget) return;
      myRadicalsAssignments = assignKanjiToBucket(k.kanji, activeAssignTarget);
      myThemeAssignments = loadMyThemeAssignments();
      renderMyRadicals();
    };
  } else if(opts.assignedMode){
    // left pane: primary click opens modal; × button unassigns back to right pane
    card.classList.add('assigned-card');
    const removeBtn = document.createElement('button');
    removeBtn.className = 'kcard-remove';
    removeBtn.title = 'Remove from this radical';
    removeBtn.textContent = '×';
    removeBtn.onclick = (e)=>{
      e.stopPropagation();
      myRadicalsAssignments = assignKanjiToBucket(k.kanji, UNASSIGNED_BUCKET);
      myThemeAssignments = assignKanjiToTheme(k.kanji, null);
      renderMyRadicals();
    };
    card.appendChild(removeBtn);
    card.onclick = openThisModal;

    // if a theme-assignment target is active for this radical, clicking re-assigns theme
    if(opts.themeAssignMode){
      card.classList.add('theme-assign-mode');
      card.onclick = (e)=>{
        if(e.target.classList.contains('kcard-remove')) return;
        if(!activeThemeTarget) return openThisModal();
        myThemeAssignments = assignKanjiToTheme(k.kanji,
          myThemeAssignments[k.kanji] === activeThemeTarget.theme ? null : activeThemeTarget.theme
        );
        renderMyRadicals();
      };
    }
  } else {
    card.onclick = openThisModal;
  }
  return card;
}

// after a grid is in the DOM, look up which kanji have a saved screenshot and
// drop a small thumbnail into their card (best-effort, non-blocking)
async function attachThumbnails(){
  try{
    const keys = await getScreenshotKeys();
    if(!keys.size) return;
    document.querySelectorAll('.kcard').forEach(async (card)=>{
      const kanji = card.dataset.kanji;
      if(keys.has(kanji)){
        const dataUrl = await loadScreenshot(kanji);
        const slot = card.querySelector('.thumb-slot');
        if(slot && dataUrl){
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = dataUrl;
          slot.appendChild(img);
        }
      }
    });
  } catch(e){ console.warn('thumbnail load failed', e); }
}

          chip.className = 'myrad-theme-chip' + (isActive ? ' active' : '');

/* ---------------- export / import backup ---------------- */
async function exportBackup(){
  let screenshots = {};
  try{
    screenshots = await getAllScreenshotsForExport();
  } catch(e){
    console.warn('Could not read screenshots for export', e);
    alert('Could not read your saved screenshots for export. The radical list and assignments will still be exported.');
  }
  const backup = {
    exportedAt: new Date().toISOString(),
    formatVersion: 1,
    myRadicalsList: loadMyRadicalsList(),
    myRadicalsAssignments: loadMyRadicalsAssignments(),
    myThemesList: loadMyThemesList(),
    myThemeAssignments: loadMyThemeAssignments(),
    screenshots: screenshots
  };
  const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = backup.exportedAt.slice(0,10);
  a.href = url;
  a.download = `kanji-explorer-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importBackup(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;

  let backup;
  try{
    const text = await file.text();
    backup = JSON.parse(text);
  } catch(err){
    alert('That file could not be read as a backup — it may not be a valid export from this tool.');
    return;
  }
  if(!backup || typeof backup !== 'object' || !backup.formatVersion){
    alert('That file does not look like a kanji explorer backup.');
    return;
  }

  const existingCount = Object.keys(loadMyRadicalsAssignments()).length;
  const incomingCount = Object.keys(backup.myRadicalsAssignments || {}).length;
  const proceed = confirm(
    `Import this backup from ${backup.exportedAt ? backup.exportedAt.slice(0,10) : 'an unknown date'}?\n\n` +
    `This will REPLACE everything currently saved in this browser:\n` +
    `- your current ${existingCount} kanji assignment(s) will be replaced with ${incomingCount} from the backup\n` +
    `- your current radical list will be replaced with the backup's list\n` +
    `- your current screenshots will be replaced with the backup's screenshots\n\n` +
    `This cannot be undone. Export a backup of your current state first if you're not sure.`
  );
  if(!proceed) return;

  try{
    localStorage.setItem(MYRAD_LIST_KEY, JSON.stringify(backup.myRadicalsList || []));
    localStorage.setItem(MYRAD_ASSIGN_KEY, JSON.stringify(backup.myRadicalsAssignments || {}));
    localStorage.setItem(MYTHEME_LIST_KEY, JSON.stringify(backup.myThemesList || {}));
    localStorage.setItem(MYTHEME_ASSIGN_KEY, JSON.stringify(backup.myThemeAssignments || {}));
  } catch(err){
    alert('Could not write the imported radical list/assignments to this browser\'s storage.');
    return;
  }

  try{
    const db = await getDB();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror = ()=> reject(tx.error);
    });
    await restoreAllScreenshots(backup.screenshots || {});
  } catch(err){
    console.warn('Could not restore screenshots', err);
    alert('Radical list and assignments were imported, but screenshots could not be restored.');
  }

  invalidateScreenshotCache();
  myRadicalsList = loadMyRadicalsList();
  myRadicalsAssignments = loadMyRadicalsAssignments();
  myThemesList = loadMyThemesList();
  myThemeAssignments = loadMyThemeAssignments();
  activeAssignTarget = null;
  activeThemeTarget = null;
  renderMyRadicals();
  alert('Backup imported successfully.');
}

/* ---------------- stroke-order animation ---------------- */
let currentStrokeAnim = null;
let activePathEls = [];
let stepIndex = -1;

// Standard 6-color stroke-order palette (the same cycle used by Jisho.org and similar
// dictionary sites): stroke 1 red, 2 blue, 3 green, 4 yellow, 5 purple, 6 orange, then
// repeats for kanji with more than 6 strokes.
const STROKE_COLORS = ['#FF0000', '#0000FF', '#008000', '#FFC400', '#800080', '#FFA500'];

function buildStrokeSVG(strokePaths){
  const svg = document.getElementById('stroke-svg');
  svg.innerHTML = '';
  return strokePaths.map((d, i)=>{
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d);
    p.setAttribute('fill','none');
    p.setAttribute('stroke', STROKE_COLORS[i % STROKE_COLORS.length]);
    p.setAttribute('stroke-width','3.2');
    p.setAttribute('stroke-linecap','round');
    p.setAttribute('stroke-linejoin','round');
    svg.appendChild(p);
    return p;
  });
}
function getPathLen(p){
  // animCJK paths set pathLength="3333" as a normalized coordinate system.
  // KanjiVG paths do not set pathLength, so we use getTotalLength() for those.
  const attr = p.getAttribute('pathLength');
  return attr ? parseFloat(attr) : p.getTotalLength();
}

function animateStrokes(pathEls, perStrokeMs){
  if(currentStrokeAnim) currentStrokeAnim.cancelled = true;
  const anim = { cancelled:false };
  currentStrokeAnim = anim;
  pathEls.forEach(p=>{
    const len = getPathLen(p);
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.opacity = '0.18';
  });
  let i = 0;
  function drawNext(){
    if(anim.cancelled || i >= pathEls.length) return;
    const p = pathEls[i];
    p.style.opacity = '1';
    // Two nested requestAnimationFrame calls are required: the first lets the browser
    // commit the initial state (dashoffset = len, opacity visible), the second then
    // applies the transition target (dashoffset = 0). Without this, the very first
    // stroke collapses to its end state instantly with no animation.
    requestAnimationFrame(()=>{
      p.style.transition = `stroke-dashoffset ${perStrokeMs*0.78}ms ease-in-out`;
      requestAnimationFrame(()=>{ p.style.strokeDashoffset = '0'; });
    });
    i++;
    setTimeout(drawNext, perStrokeMs);
  }
  drawNext();
  return anim;
}
function showStrokeAtIndex(pathEls, idx){
  pathEls.forEach((p,i)=>{
    const len = getPathLen(p);
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = i <= idx ? 0 : len;
    p.style.opacity = i <= idx ? '1' : '0.18';
  });
}

async function refreshScreenshotZone(kanji){

      actions.style.display = 'flex';
    } else {
      actions.style.display = 'none';
    }
  } catch(e){

    actions.style.display = 'none';

}

});

document.getElementById('stroke-replay').onclick = ()=>{
  if(!activePathEls.length) return;
  stepIndex = -1;
  try{
    // Reset all paths to their initial hidden state synchronously FIRST,
    // so the browser has a clean starting point before the double-rAF animation begins.
    // Without this, paths already at dashoffset=0 from the previous run don't visibly
    // reset before the new animation starts, causing the same first-stroke skip bug.
    activePathEls.forEach(p=>{
      p.style.transition = 'none';
      p.style.strokeDashoffset = p.style.strokeDasharray; // back to fully hidden
      p.style.opacity = '0.18';
    });
    // Let the browser commit those reset styles in one frame, then animate
    requestAnimationFrame(()=>{
      const speed = Number(document.getElementById('stroke-speed').value);
      currentStrokeAnim = animateStrokes(activePathEls, speed);
    });
  } catch(err){ console.warn('Replay failed', err); }
};
document.getElementById('stroke-step').onclick = ()=>{
  if(!activePathEls.length) return;
  if(currentStrokeAnim) currentStrokeAnim.cancelled = true;
  stepIndex = Math.min(stepIndex + 1, activePathEls.length - 1);
  showStrokeAtIndex(activePathEls, stepIndex);
};
function restoreStrokeSVG(){
  const wrap = document.querySelector('.stroke-svg-wrap');
  if(!document.getElementById('stroke-svg')){
    // Hangul modal replaced the SVG — restore it
    wrap.innerHTML = '<svg id="stroke-svg" viewBox="0 0 109 109" xmlns="http://www.w3.org/2000/svg"></svg>';
  }
}
document.getElementById('modal-close').onclick = ()=>{
  document.getElementById('modal-overlay').classList.remove('open');
  restoreStrokeSVG();
};
document.getElementById('modal-overlay').onclick = (e)=>{

    e.currentTarget.classList.remove('open');

};

/* ---------------- handwriting practice pad ---------------- */
const pc = document.getElementById('practice-canvas');
const pctx = pc.getContext('2d');
let pStrokes = [], pCur = null, pChar = '', pGhost = true;
function pRedraw(){
  const w = pc.width;
  pctx.clearRect(0, 0, w, w);
  pctx.strokeStyle = '#d8cdb4'; pctx.lineWidth = 2; pctx.setLineDash([8, 8]);
  pctx.beginPath(); pctx.moveTo(w/2, 0); pctx.lineTo(w/2, w); pctx.moveTo(0, w/2); pctx.lineTo(w, w/2);
  pctx.stroke(); pctx.setLineDash([]);
  if(pGhost && pChar){
    pctx.fillStyle = 'rgba(43,38,32,0.12)';
    pctx.font = `${w*0.8}px "Hiragino Mincho ProN","Noto Serif JP",serif`;
    pctx.textAlign = 'center'; pctx.textBaseline = 'middle';
    pctx.fillText(pChar, w/2, w/2 + w*0.03);
  }
  pctx.lineCap = 'round'; pctx.lineJoin = 'round'; pctx.lineWidth = 16;
  pStrokes.forEach((s, i)=>{
    pctx.strokeStyle = STROKE_COLORS[i % STROKE_COLORS.length];
    pctx.beginPath();
    s.forEach((pt, j)=> j ? pctx.lineTo(pt.x, pt.y) : pctx.moveTo(pt.x, pt.y));
    if(s.length === 1) pctx.lineTo(s[0].x + 0.1, s[0].y);
    pctx.stroke();
  });
}
function pPos(e){
  const r = pc.getBoundingClientRect();
  return { x:(e.clientX - r.left) * pc.width / r.width, y:(e.clientY - r.top) * pc.height / r.height };
}
pc.addEventListener('pointerdown', e=>{ e.preventDefault(); pc.setPointerCapture(e.pointerId); pCur = [pPos(e)]; pStrokes.push(pCur); pRedraw(); });
pc.addEventListener('pointermove', e=>{ if(!pCur) return; pCur.push(pPos(e)); pRedraw(); });
['pointerup','pointercancel'].forEach(t=> pc.addEventListener(t, ()=>{ pCur = null; }));
document.getElementById('practice-undo').onclick  = ()=>{ pStrokes.pop(); pRedraw(); };
document.getElementById('practice-clear').onclick = ()=>{ pStrokes = []; pRedraw(); };
document.getElementById('practice-ghost').onclick = (e)=>{ pGhost = !pGhost; e.target.textContent = 'Guide: ' + (pGhost ? 'on' : 'off'); pRedraw(); };
function resetPractice(ch){ pChar = ch; pStrokes = []; pCur = null; pRedraw(); }
document.addEventListener('click', e=>{
  const card = e.target.closest('.kcard');
  if(!card || card.classList.contains('assign-mode')) return;
  const kc = card.querySelector('.kc');
  if(kc) resetPractice(kc.textContent.trim());
}, true);

render();
</script>
</body>
</html>
